---
layout: rd
---
{% include rd-ctx.html %}
<header class="page-head">
  <div class="wrap">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
  </div>
</header>
<div class="wrap page-body{% if page.width == 'wide' %} page-body--wide{% endif %}">
{{ content }}
</div>
