---
layout: rd
---
{% include rd-ctx.html %}
<header class="page-head">
  <div class="wrap">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
  </div>
</header>
{%- if page.width == 'wide' %}
<div class="wrap page-body page-body--wide">
{{ content }}
</div>
{%- else %}
<div class="wrap page-layout" data-page-layout>
<div class="page-body">
{{ content }}
</div>
<aside class="page-aside" data-page-aside aria-label="{{ t.on_this_page }}" hidden></aside>
</div>
{%- endif %}
