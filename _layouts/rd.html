---
---
{% include rd-ctx.html %}
<!doctype html>
<html lang="{{ page_lang }}" data-base="{{ base_path }}" data-lang="{{ page_lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){var d=document.documentElement;d.className+=' js';try{var m=localStorage.getItem('theme');if(m==='dark'||m==='light')d.setAttribute('data-theme',m);}catch(e){}})();</script>
{% include rd-seo.html %}
{% if has_alt %}
<link rel="alternate" hreflang="{{ page_lang }}" href="{{ base_path }}{{ page.url }}">
<link rel="alternate" hreflang="{{ alt_lang }}" href="{{ base_path }}{{ alt_url }}">
{% endif %}
<meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1218" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="{{ base_path }}/images/favicon-32x32.png">
<link rel="icon" href="{{ base_path }}/images/favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png">
<link rel="manifest" href="{{ base_path }}/images/manifest.json">
<link rel="alternate" type="application/rss+xml" title="{{ t.name }} · {{ t.news }}" href="{{ base_path }}/news/feed.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="{{ base_path }}/assets/css/rd.css">
<link rel="preload" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
{% if page.map %}<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">{% endif %}
</head>
<body class="{{ page.body_class }}">
<a class="skip" href="#main">{{ t.skip }}</a>
{% include rd-header.html %}
<main id="main" tabindex="-1">
{{ content }}
</main>
{% include rd-footer.html %}
{% include rd-scripts.html %}
</body>
</html>
