# Publications shown on the Publications page (English and Vietnamese) and on the home page.
#
# types: the sections of the Publications page, in display order.
# items: one entry per work.
#   type      one of the keys under `types`
#   authors   APA author string; "Nguyen-Trong, T." is shown in bold automatically (spaces between initials are non-breaking)
#   bib_*     fields used to build the BibTeX entry
#   coauthors ids from _data/coauthors.yml (used by the Co-authors page)
#   featured  true = shown under "Selected work" on the home page
#   abstract / abstract_vi, doi, url, pdf, slides: optional; buttons appear only when filled
#   doi_all   software only: the all-versions (concept) DOI used by the Software & Data page

