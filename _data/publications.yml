    abstract: "A traceable Python tool that builds cross-country panels of government expenditure by function (COFOG) from IMF Government Finance Statistics. Every cleaning and harmonisation step is documented so that the resulting panels can be reproduced and audited."
    abstract_vi: "Công cụ Python có khả năng truy vết, dùng để xây dựng dữ liệu bảng xuyên quốc gia về chi tiêu chính phủ theo chức năng (COFOG) từ Thống kê Tài chính Chính phủ (GFS) của IMF. Mọi bước làm sạch và hài hòa hóa dữ liệu đều được ghi chép đầy đủ để bộ dữ liệu bảng có thể được tái lập và kiểm chứng."
    bib_type: software
    bib_authors: "Nguyen-Trong, Tin"
    bib_version: "1.0.5"
