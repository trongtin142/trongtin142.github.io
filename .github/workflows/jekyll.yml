# Build the Jekyll site and deploy it to GitHub Pages.
# Third-party actions are pinned to full commit SHAs (the tag is in the comment);
# Dependabot (.github/dependabot.yml) proposes updates once a week.
name: Deploy Academic Pages template site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Rebuild every 3 hours (at minute 17, UTC) so the visitor statistics and the ORCID list stay current
  schedule:
    - cron: "17 */3 * * *"

# Nothing by default; each job asks only for what it needs.
permissions: {}

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job: read-only access to the repository. It holds the GoatCounter token
  # but cannot write to the repo or deploy.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Ruby
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Fetch ORCID works
        # Refreshes _data/orcid.json from the public ORCID API; keeps the committed copy if the call fails
        run: |
          if curl -sf --max-time 30 -H "Accept: application/json" "https://pub.orcid.org/v3.0/0009-0006-0017-6374/works" -o /tmp/orcid.json && python3 -c "import json; json.load(open('/tmp/orcid.json'))"; then
            cp /tmp/orcid.json _data/orcid.json
          else
            echo "ORCID fetch failed, keeping the committed snapshot"
          fi
      - name: Fetch visitor statistics
        # Writes _data/stats.json from the GoatCounter API for the Stats page; skipped without the GOATCOUNTER_TOKEN secret
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python3 scripts/fetch-goatcounter-stats.py
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  # Deployment job: the only job allowed to publish to Pages.
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
