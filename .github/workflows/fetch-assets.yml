# One-off helper: downloads the university logos and research photos into the repo,
# applies the matching layout changes, and commits. Delete this file after it has run.
name: Fetch logos and research photos (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install image tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick librsvg2-bin

      - name: Download and prepare images
        run: |
          set -euo pipefail
          UA="trongtin142.github.io asset fetch (+https://github.com/trongtin142/trongtin142.github.io)"
          get() { curl -fsSL --retry 3 -A "$UA" -o "$2" "$1"; }
          sq() { convert "$1" -background none -gravity center -resize 128x128 -extent 128x128 -strip "PNG32:$2"; }
          mkdir -p images/logos images/research tmp

          # Research theme photos (Unsplash License): Thomas T, CHUTTERSNAP, Luke Chesser, Clement Souchet
          get "https://images.unsplash.com/photo-1635372722656-389f87a941b7?w=800&h=500&fit=crop&q=75&fm=jpg" images/research/general-equilibrium.jpg
          get "https://images.unsplash.com/photo-1494412519320-aa613dfb7738?w=800&h=500&fit=crop&q=75&fm=jpg" images/research/cge-trade.jpg
          get "https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=800&h=500&fit=crop&q=75&fm=jpg" images/research/econometrics.jpg
          get "https://images.unsplash.com/photo-1586061968253-7bf5724aab7b?w=800&h=500&fit=crop&q=75&fm=jpg" images/research/agroforestry.jpg

          # University marks (official files), squared to 128 x 128 PNG
          get "https://upload.wikimedia.org/wikipedia/commons/5/53/ESCP_logo_2026.png" tmp/escp.png
          get "https://www.sciencespo.fr/fr/favicon.svg" tmp/sciences-po.svg
          get "https://upload.wikimedia.org/wikipedia/vi/2/29/Logo-HCMIU.svg" tmp/iu.svg
          get "https://www.parisnanterre.fr/uas/Internet/FAVICON/202207-DIRCOM-favicon-v01.png" tmp/nanterre.png
          get "https://upload.wikimedia.org/wikipedia/vi/1/12/Logo_ULaw.png" tmp/ulaw.png

          convert tmp/escp.png -crop 962x1196+0+0 +repage -trim +repage tmp/escp-star.png
          sq tmp/escp-star.png images/logos/escp.png
          rsvg-convert -w 256 -h 256 --keep-aspect-ratio tmp/sciences-po.svg -o tmp/sciences-po.png
          sq tmp/sciences-po.png images/logos/sciences-po.png
          rsvg-convert -w 256 -h 256 --keep-aspect-ratio tmp/iu.svg -o tmp/iu.png
          sq tmp/iu.png images/logos/iu-vnuhcm.png
          convert tmp/nanterre.png -trim +repage tmp/nanterre-trim.png
          sq tmp/nanterre-trim.png images/logos/paris-nanterre.png
          convert tmp/ulaw.png -crop 93x92+48+0 +repage tmp/ulaw-emblem.png
          sq tmp/ulaw-emblem.png images/logos/hcmulaw.png

          rm -rf tmp
          ls -la images/logos images/research

      - name: Apply layout changes
        run: |
          set -euo pipefail
          git apply --whitespace=nowarn <<'PATCH'
          diff --git a/_data/timeline.yml b/_data/timeline.yml
          index 7a78748..4fc28cf 100644
          --- a/_data/timeline.yml
          +++ b/_data/timeline.yml
          @@ -84,18 +84,24 @@ education:
           teaching:
             - start: 2026
               org: "ESCP Business School, France"
          +    logo: /images/logos/escp.png
          +    logo_order: 2
               org_vi: "ESCP Business School, Pháp"
               courses: "Microeconomics (UG)"
               courses_vi: "Kinh tế vi mô (đại học)"
               current: true
             - start: 2025
               org: "Sciences Po, France"
          +    logo: /images/logos/sciences-po.png
          +    logo_order: 3
               org_vi: "Sciences Po, Pháp"
               courses: "Trade and International Finance; The Economy; Quantitative Methods for the Humanities and Social Sciences; Mathematics Applied to Quantitative Social Sciences (UG)"
               courses_vi: "Thương mại và Tài chính quốc tế; Nền kinh tế (The Economy); Phương pháp định lượng cho Khoa học xã hội và nhân văn; Toán ứng dụng trong Khoa học xã hội định lượng (đại học)"
               current: true
             - start: 2025
               org: "School of Business, International University, VNU-HCM, Vietnam"
          +    logo: /images/logos/iu-vnuhcm.png
          +    logo_order: 4
               org_vi: "Khoa Quản trị Kinh doanh, Trường Đại học Quốc tế, ĐHQG-HCM, Việt Nam"
               courses: "Statistics for Business; Organizational Behavior; Workshop I (UG)"
               courses_vi: "Thống kê trong kinh doanh; Hành vi tổ chức; Workshop I (đại học)"
          @@ -103,12 +109,16 @@ teaching:
             - start: 2023
               end: 2025
               org: "Université Paris Nanterre, France"
          +    logo: /images/logos/paris-nanterre.png
          +    logo_order: 1
               org_vi: "Đại học Paris Nanterre, Pháp"
               courses: "Mathematics and Probability (M1); Programming: Focus on Power BI (M2); Business English for Banking and Finance (M1)"
               courses_vi: "Toán và Xác suất (M1); Lập trình: chuyên đề Power BI (M2); Tiếng Anh thương mại cho Ngân hàng và Tài chính (M1)"
             - start: 2013
               end: 2023
               org: "Ho Chi Minh City University of Law, Vietnam"
          +    logo: /images/logos/hcmulaw.png
          +    logo_order: 5
               org_vi: "Trường Đại học Luật TP. Hồ Chí Minh, Việt Nam"
               courses: "Econometrics; Macroeconomics; Microeconomics (UG)"
